<svg xmlns="http://www.w3.org/2000/svg" width="860" height="570" viewBox="0 0 860 570"
     role="img" aria-labelledby="title description">
  <title id="title">Tiny Multi-Agent 에이전트 협업 구조</title>
  <desc id="description">lead와 검토자, 초안, 검토 의견, 최종 답변을 서로 다른 상징으로 표시한
    협업 맵. lead가 초안을 만들면 여러 검토자가 같은 요청과 초안 발췌를 독립적으로 검토한다.
    오케스트레이터는 성공한 의견을 모아 lead에 전달한다. lead는 요청, 초안, 의견을 바탕으로 최종 답변을 만든다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#93adcb"/>
    </marker>
    <g id="lens">
      <circle cx="0" cy="0" r="21" fill="#263855" stroke-width="1.6"/>
      <circle cx="-2" cy="-2" r="7.5"/>
      <path d="m3 3 7 7"/>
    </g>
  </defs>
  <style>
    text { font-family: "Noto Sans CJK KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; fill: #f4f7fd; }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 2px; fill: #8de1cf; }
    .title { font-size: 29px; font-weight: 700; }
    .label { font-size: 17px; font-weight: 700; }
    .sub { font-size: 14px; fill: #c0cfe3; }
    .edge-label { font-size: 13px; fill: #bed2e8; }
    .line { fill: none; stroke: #93adcb; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
    .icon { fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
  </style>

  <rect width="860" height="570" rx="20" fill="#101a2b"/>
  <text class="eyebrow" x="32" y="31">TINY MULTI-AGENT / COLLABORATION MAP</text>
  <text class="title" x="32" y="64">에이전트 협업 구조</text>
  <text class="sub" x="32" y="88">초안은 여러 검토자로 나뉘어 전달되고, 검토 의견은 lead로 모인다.</text>

  <rect x="566" y="113" width="256" height="356" rx="16" fill="#17273e" stroke="#5e7595" stroke-dasharray="5 5"/>
  <text class="eyebrow" x="587" y="141">REVIEW POOL</text>
  <text class="sub" x="587" y="163">--jobs로 동시 실행 수 제한</text>

  <g class="line" marker-end="url(#arrow)">
    <path d="M150 172 V197"/>
    <path d="M210 244 H380"/>
    <path d="M441 244 H516 V225 H588"/>
    <path d="M516 244 V348 H588"/>
    <path d="M771 225 H795 V430 H469"/>
    <path d="M771 348 H795" marker-end="none"/>
    <path d="M398 430 H286 V271 H197"/>
    <path d="M150 327 V405"/>
  </g>
  <g class="edge-label" text-anchor="middle">
    <text x="295" y="230">초안 작성</text>
    <text x="511" y="209">요청 + 초안 발췌</text>
    <text x="645" y="417">완료된 검토 결과 수집</text>
    <text x="338" y="401">성공한 의견</text>
    <text x="338" y="420">발췌 전달</text>
    <text x="201" y="375">종합 답변</text>
    <text x="214" y="395">요청 · 초안 · 의견 반영</text>
  </g>

  <!-- Original user message -->
  <path d="M95 119h110a11 11 0 0 1 11 11v22a11 11 0 0 1-11 11h-43l-12 9-3-9H95a11 11 0 0 1-11-11v-22a11 11 0 0 1 11-11z"
        fill="#24364e" stroke="#7a9ab9" stroke-width="1.6"/>
  <text class="label" x="150" y="147" text-anchor="middle">사용자 요청</text>

  <!-- Lead agent -->
  <path d="M115 200h70l25 44-25 45h-70l-25-45z" fill="#213d48" stroke="#8de1cf" stroke-width="2.3"/>
  <g class="icon" style="color:#a6f2df">
    <rect x="129" y="228" width="42" height="34" rx="9"/>
    <path d="M150 228v-8m-21 25h-5m47 0h5m-32 8h12"/>
    <circle cx="150" cy="218" r="2"/>
    <circle cx="142" cy="242" r="1.7" fill="currentColor" stroke="none"/>
    <circle cx="158" cy="242" r="1.7" fill="currentColor" stroke="none"/>
  </g>
  <text class="label" x="150" y="312" text-anchor="middle">lead · 초안 / 종합</text>

  <!-- Draft document -->
  <g class="icon" style="color:#abd5ff">
    <path d="M385 204h38l18 18v56h-56z" fill="#203955"/>
    <path d="M423 204v18h18m-43 14h30m-30 11h30m-30 11h21"/>
  </g>
  <text class="label" x="413" y="302" text-anchor="middle">초안</text>

  <!-- Independent reviewers -->
  <rect x="592" y="191" width="179" height="68" rx="28" fill="#243554" stroke="#7895be"/>
  <rect x="592" y="314" width="179" height="68" rx="28" fill="#243554" stroke="#7895be"/>
  <g class="icon">
    <use href="#lens" x="623" y="225" style="color:#c6bcfa"/>
    <use href="#lens" x="623" y="348" style="color:#abd5ff"/>
  </g>
  <text class="label" x="655" y="223">reviewer A</text>
  <text class="sub" x="655" y="244">독립 검토</text>
  <text class="label" x="655" y="346">reviewer B</text>
  <text class="sub" x="655" y="367">독립 검토</text>

  <!-- Feedback bundle -->
  <g class="icon" style="color:#d2c1ff">
    <path d="M416 387h50v61h-50z" fill="#272f4d"/>
    <path d="M407 395h50v61h-50z" fill="#303458"/>
    <path d="M398 403h50v61h-50z" fill="#393461"/>
    <path d="M410 420h26m-26 11h26m-26 11h19"/>
  </g>
  <text class="label" x="429" y="491" text-anchor="middle">검토 의견 묶음</text>

  <!-- Final answer -->
  <g class="icon" style="color:#9af1d9">
    <path d="M124 411h34l18 18v51h-52z" fill="#214144"/>
    <path d="M158 411v18h18m-39 17 9 9 16-17"/>
  </g>
  <text class="label" x="150" y="506" text-anchor="middle">최종 답변</text>

  <path d="M32 526h796" stroke="#405570"/>
  <text class="sub" x="32" y="550">간선은 workflow.py가 역할 사이에 전달하는 프롬프트와 응답을 나타낸다.</text>
</svg>
