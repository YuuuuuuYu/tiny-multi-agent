<svg xmlns="http://www.w3.org/2000/svg" width="760" height="657" viewBox="0 0 760 657"
     role="img" aria-labelledby="title description">
  <title id="title">Tiny Multi-Agent 실행 워크플로우</title>
  <desc id="description">lead가 초안을 작성한다. 검토자가 없으면 초안을 반환한다. 검토자가 있으면
    같은 요청과 초안 발췌를 받아 독립적으로 검토한다. 하나 이상의 검토에 성공하면 lead가 성공한
    검토만 종합한다. 검토가 모두 실패하면 초안을 반환한다. 초안이나 종합에 실패하면 코드 1로 종료한다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#92a8c4"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Noto Sans CJK KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; fill: #f1f5fb; }
    .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 2px; fill: #8edeca; }
    .title { font-size: 27px; font-weight: 700; }
    .label { font-size: 17px; font-weight: 700; }
    .sub { font-size: 13px; fill: #b9c8dd; }
    .tag { font-size: 14px; font-weight: 700; fill: #8edeca; }
    .wire { fill: none; stroke: #92a8c4; stroke-width: 2; stroke-linejoin: round; }
  </style>

  <rect width="760" height="657" rx="20" fill="#101a2b"/>
  <text class="eyebrow" x="34" y="30">TINY MULTI-AGENT / WORKFLOW</text>
  <text class="title" x="34" y="61">실행 워크플로우</text>
  <text class="sub" x="34" y="83">검토자는 같은 초안을 독립적으로 읽고, lead는 성공한 의견을 모아 종합한다.</text>

  <g class="wire" marker-end="url(#arrow)">
    <path d="M485 136 H536"/>
    <path d="M261 165 V185"/>
    <path d="M381 216 H536"/>
    <path d="M261 244 V276"/>
    <path d="M261 376 V403"/>
    <path d="M381 434 H536"/>
    <path d="M261 462 V496"/>
    <path d="M485 530 H536"/>
    <path d="M261 560 V598"/>
  </g>

  <rect x="37" y="107" width="448" height="58" rx="12" fill="#1e3454" stroke="#658ab9"/>
  <text class="tag" x="54" y="131">01</text>
  <text class="label" x="85" y="131">초안 작성</text>
  <text class="sub" x="85" y="152">lead가 원본 요청에 답변</text>

  <rect x="540" y="107" width="185" height="58" rx="10" fill="#412b3d" stroke="#b87991"/>
  <text class="label" x="555" y="131">초안 실패</text>
  <text class="sub" x="555" y="152">오류 기록 · exit 1</text>

  <path d="M164 188 H358 L381 216 358 244 H164 L141 216z" fill="#2b3652" stroke="#8493ba"/>
  <text class="label" x="261" y="222" text-anchor="middle">검토자가 있나?</text>
  <text class="sub" x="405" y="207">없음</text>
  <text class="sub" x="274" y="265">있음</text>

  <rect x="540" y="187" width="185" height="58" rx="10" fill="#193b3b" stroke="#528d81"/>
  <text class="label" x="555" y="211">초안 반환</text>
  <text class="sub" x="555" y="232">단일 모델 · exit 0</text>

  <rect x="37" y="280" width="448" height="96" rx="12" fill="#24365c" stroke="#738cce"/>
  <text class="tag" x="54" y="305">02</text>
  <text class="label" x="85" y="305">독립 검토</text>
  <text class="sub" x="85" y="328">같은 요청과 초안 발췌 · --jobs로 동시 실행 제한</text>
  <g fill="#182843" stroke="#667faa">
    <rect x="85" y="339" width="102" height="24" rx="7"/>
    <rect x="196" y="339" width="102" height="24" rx="7"/>
    <rect x="307" y="339" width="102" height="24" rx="7"/>
  </g>
  <g class="sub" text-anchor="middle">
    <text x="136" y="356">검토 A</text>
    <text x="247" y="356">검토 B</text>
    <text x="358" y="356">추가 검토 …</text>
  </g>

  <path d="M164 406 H358 L381 434 358 462 H164 L141 434z" fill="#2b3652" stroke="#8493ba"/>
  <text class="label" x="261" y="440" text-anchor="middle">성공한 검토가 있나?</text>
  <text class="sub" x="405" y="425">모두 실패</text>
  <text class="sub" x="274" y="484">한 건 이상</text>

  <rect x="540" y="405" width="185" height="58" rx="10" fill="#44372a" stroke="#ba985a"/>
  <text class="label" x="555" y="429">초안으로 대체</text>
  <text class="sub" x="555" y="450">degraded · exit 0</text>

  <rect x="37" y="500" width="448" height="60" rx="12" fill="#282f50" stroke="#8e83bd"/>
  <text class="tag" x="54" y="525">03</text>
  <text class="label" x="85" y="525">결과 종합</text>
  <text class="sub" x="468" y="525" text-anchor="end">일부 실패 시 degraded</text>
  <text class="sub" x="85" y="547">lead가 요청 · 초안 발췌 · 성공한 검토 발췌를 종합</text>

  <rect x="540" y="501" width="185" height="58" rx="10" fill="#412b3d" stroke="#b87991"/>
  <text class="label" x="555" y="525">종합 실패</text>
  <text class="sub" x="555" y="546">오류 기록 · exit 1</text>

  <text class="sub" x="274" y="583">종합 성공</text>
  <rect x="37" y="602" width="448" height="39" rx="10" fill="#193b3b" stroke="#528d81"/>
  <text class="label" x="54" y="628">최종 답변 · exit 0</text>
</svg>
